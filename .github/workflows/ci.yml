name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only the fast, headless checks run here. UI, native and packaging suites need a
# Playwright browser, a real display and the tokscale binary, so they stay local.

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.15'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download Electron binary
        # `--ignore-scripts` skips Electron's postinstall; the app's own module
        # resolution needs the binary present even for non-UI lint/test runs.
        run: node node_modules/electron/install.js

      - name: Verify (ESLint + unit tests)
        run: npm run verify

      - name: Runtime audit
        run: npm run audit:runtime
