name: Feature request
description: 建议一个新功能或改进
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        提交前请先确认这不是[已知限制](../blob/main/README.md#已知限制)中的一条。

  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 描述场景与痛点，而不是直接给出实现方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你期望的行为
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
    validations:
      required: false

  - type: checkboxes
    id: boundaries
    attributes:
      label: 边界确认
      description: 本项目的四条硬边界不可协商。请确认你的建议不违反其中任何一条。
      options:
        - label: 该功能不需要读取认证文件或凭据
          required: true
        - label: 该功能不需要修改来源 Agent 的数据库或配置
          required: true
        - label: 该功能不需要上传任何数据
          required: true
        - label: 该功能不需要新增网络请求（价格同步与 Codex 官方 CLI 除外）
          required: true
