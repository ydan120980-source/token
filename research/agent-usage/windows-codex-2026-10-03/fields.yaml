field_categories:
  - category: "Product fit"
    fields:
      - name: "purpose"
        description: "Monitoring goal and user tasks; distinguish statistics from agent control."
        detail_level: "moderate"
      - name: "platforms"
        description: "Windows compatibility and relevant macOS origins; document iOS as deferred."
        detail_level: "moderate"
      - name: "gap_to_requirements"
        description: "Fit to existing Electron, five local usage sources, Codex-only quota and privacy boundaries."
        detail_level: "detailed"
  - category: "Data collection and correctness"
    fields:
      - name: "sources_and_versions"
        description: "Distinguish fixed releases, immutable commits, current main and actual local versions."
        detail_level: "detailed"
      - name: "capabilities_and_quality"
        description: "Disjoint token fields, quota windows, estimate coverage, stale data and unknown values."
        detail_level: "detailed"
      - name: "deduplication"
        description: "Cumulative counters, archives, copies, shared databases and same-account duplicate connections."
        detail_level: "detailed"
  - category: "Architecture and privacy"
    fields:
      - name: "stack_and_interfaces"
        description: "Existing Electron entry isolation, official CLI RPC and separate usage/quota contracts."
        detail_level: "moderate"
      - name: "security_and_encryption"
        description: "Keyring effectiveness, credential locality, isolation and the deferred production E2EE boundary."
        detail_level: "detailed"
      - name: "side_effects"
        description: "Account/config mutations, hooks, telemetry, uploads and required network behavior."
        detail_level: "detailed"
  - category: "Delivery and evidence"
    fields:
      - name: "license_and_maintenance"
        description: "Observed release and source evidence; do not treat stars or a candidate UI as acceptance."
        detail_level: "moderate"
      - name: "validation_and_limits"
        description: "Separate source review, previous records, synthetic tests and real Windows/account acceptance."
        detail_level: "detailed"
      - name: "references"
        description: "Direct primary sources and immutable anchors where available."
        detail_level: "moderate"
