field_categories:
  - category: "Product fit"
    fields:
      - name: "purpose"
        description: "The product problem and target users; distinguish monitoring from remote agent control."
        detail_level: "moderate"
      - name: "platforms"
        description: "Windows, iOS and other targets; distinguish a dedicated app from a web page or third-party widget."
        detail_level: "moderate"
      - name: "gap_to_requirements"
        description: "Differences from read-only internet access, broad agent coverage and end-to-end encrypted statistics."
        detail_level: "detailed"
  - category: "Data collection and correctness"
    fields:
      - name: "sources_and_versions"
        description: "Supported products, variants, versions, storage paths and official or internal APIs."
        detail_level: "detailed"
      - name: "capabilities_and_quality"
        description: "Token totals, disjoint components, quotas, costs, attribution, coverage, partial data and unknown fields."
        detail_level: "detailed"
      - name: "deduplication"
        description: "Handling of cumulative counters, archives, copies, subagents and cross-device account snapshots."
        detail_level: "detailed"
  - category: "Architecture and privacy"
    fields:
      - name: "stack_and_interfaces"
        description: "Collection, desktop/mobile UI, API, local database and cloud storage contracts."
        detail_level: "moderate"
      - name: "security_and_encryption"
        description: "Credential locality, content encryption, permission separation, pairing, revocation and metadata disclosure."
        detail_level: "detailed"
      - name: "side_effects"
        description: "Configuration mutations, hooks, telemetry, uploads and external services required by normal use."
        detail_level: "detailed"
  - category: "Delivery and evidence"
    fields:
      - name: "license_and_maintenance"
        description: "Repository license, release availability and maintenance evidence without treating stars as safety or stability proof."
        detail_level: "moderate"
      - name: "validation_and_limits"
        description: "Distinguish documentation review, source inspection and real runtime or device acceptance."
        detail_level: "detailed"
      - name: "references"
        description: "Direct primary source links with release tags or immutable commits where available."
        detail_level: "moderate"
