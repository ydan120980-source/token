[package]
name = "quota-engine"
version = "0.1.0"
edition.workspace = true

[dependencies]
chrono = "0.4"
getrandom = "0.3"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "sync", "time", "fs", "io-util"] }
usage-engine = { path = "../usage-engine" }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
base64 = "0.22"
regex = "1"
flate2 = "1"
tar = { version = "0.4.46", default-features = false }
zip = { version = "9.7", default-features = false, features = ["deflate-flate2"] }
ring = "0.17"
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security_WinTrust", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_System_Registry"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "time"] }
