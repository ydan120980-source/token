[package]
name = "quotadock-desktop"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
quota-engine = { path = "../crates/quota-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", default-features = false, features = ["wry", "tray-icon", "custom-protocol"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tempfile = "3"
usage-engine = { path = "../crates/usage-engine" }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
mimalloc = { version = "0.1", default-features = false }
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-notification = "2.6"
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["rustls-tls"] }
reqwest = { version = "0.13", default-features = false }

[dev-dependencies]
tauri = { version = "2", default-features = false, features = ["test"] }
